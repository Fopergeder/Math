// ── Слайдер угла ψ ──
// Слайдер — окно ровно в один оборот вокруг ТЕКУЩЕГО lvl; сам по себе он lvl
// не меняет (переключение уровня — кнопки ◀▶ или клик по счётчику).
// Положение слайдера = НАМОТАННАЯ доля оборота, а не абсолютный угол: левый
// край всегда «ничего не намотано» (точка в (1;0)), правый — полный оборот.
// При lvl<0 обход идёт по часовой, поэтому там ход слайдера вправо уменьшает
// угол (0° → −360°), иначе левый край показывал бы уже замкнутый оборот.
const angleSlider = document.getElementById('angle-slider');

// Градусы слайдера (0..360, «сколько намотано») → абсолютный угол в радианах.
function angleFromSlider(l, sweptDeg) {
  const deg = l >= 0 ? l * 360 + sweptDeg : (l + 1) * 360 - sweptDeg;
  return deg * Math.PI / 180;
}

angleSlider.addEventListener('input', function() {
  angle = angleFromSlider(lvl, parseFloat(this.value));
  revolutions = lvl;
  prevRawAngle = null;
  prevNormAngle = normalizeAngle(angle);
  draw();
});

// Синхронизирует положение слайдера с текущим углом (после перетаскивания
// точки по канвасу, сброса или прыжка по уровню) — обратное к angleFromSlider,
// с приведением намотанной доли к [0,360).
function syncSlider() {
  const deg = angle * 180 / Math.PI;
  let sweptDeg = lvl >= 0 ? deg - lvl * 360 : (lvl + 1) * 360 - deg;
  while (sweptDeg >= 360) sweptDeg -= 360;
  while (sweptDeg < 0) sweptDeg += 360;
  angleSlider.value = sweptDeg;
}

// Прыжок на уровень (виток) на delta шагов, с сохранением намотанной доли —
// слайдер визуально не двигается, меняется только «блин»/виток под ним.
function stepLevel(delta) {
  if (!delta) return;
  lvl += delta;
  angle = angleFromSlider(lvl, parseFloat(angleSlider.value));
  revolutions = lvl;
  prevRawAngle = null;
  prevNormAngle = normalizeAngle(angle);
  draw();
}
document.getElementById('lvl-prev').addEventListener('click', () => stepLevel(-1));
document.getElementById('lvl-next').addEventListener('click', () => stepLevel(1));

// Клик по самому счётчику — мгновенный прыжок на произвольный уровень.
document.getElementById('lvl-counter').addEventListener('click', function() {
  const input = window.prompt('Перейти на уровень:', lvl);
  if (input === null) return;
  const n = parseInt(input, 10);
  if (!Number.isFinite(n)) return;
  stepLevel(n - lvl);
});

// ── Режим «Интервал» ──
let intervalUnit = 'deg'; // 'deg' | 'rad'
const intFrom = document.getElementById('interval-from');
const intTo   = document.getElementById('interval-to');

// Разбирает строку с полем «от/до»: не только простое число («-450»,
// «1.57»), но и арифметическое выражение — с константами π/pi, e и функцией
// sqrt(...) («π/2», «sqrt(2)», «pi/6+sqrt(3)/2», «-2π/3», «(1+2)π»).
// Поддерживает + − * / скобки, унарный минус и неявное умножение перед
// числом/идентификатором/скобкой (2π, 3(1+1), 2sqrt(2)). При ошибке
// разбора или незавершённом вводе возвращает NaN — как раньше parseFloat('').
function parseIntervalValue(raw) {
  if (raw == null) return NaN;
  const s = String(raw).trim().toLowerCase().replace(/\s+/g, '');
  if (s === '') return NaN;
  let i = 0;
  const peek = () => s[i];
  const isDigit = c => c !== undefined && c >= '0' && c <= '9';
  const isAlpha = c => c !== undefined && ((c >= 'a' && c <= 'z') || c === 'π');

  function parseExpr() {
    let v = parseTerm();
    for (;;) {
      if (peek() === '+') { i++; v += parseTerm(); }
      else if (peek() === '-') { i++; v -= parseTerm(); }
      else break;
    }
    return v;
  }
  function parseTerm() {
    let v = parseUnary();
    for (;;) {
      const c = peek();
      if (c === '*') { i++; v *= parseUnary(); }
      else if (c === '/') { i++; v /= parseUnary(); }
      else if (c === '(' || isDigit(c) || isAlpha(c)) { v *= parseUnary(); } // неявное умножение: 2π, 2sqrt(2), 3(1+1)
      else break;
    }
    return v;
  }
  function parseUnary() {
    if (peek() === '+') { i++; return parseUnary(); }
    if (peek() === '-') { i++; return -parseUnary(); }
    return parseAtom();
  }
  function parseAtom() {
    const c = peek();
    if (c === undefined) throw new Error('unexpected end');
    if (c === '(') {
      i++;
      const v = parseExpr();
      if (peek() !== ')') throw new Error('expected )');
      i++;
      return v;
    }
    if (isDigit(c) || c === '.') {
      const start = i;
      while (i < s.length && (isDigit(s[i]) || s[i] === '.')) i++;
      return parseFloat(s.slice(start, i));
    }
    if (c === 'π') { i++; return Math.PI; }
    if (isAlpha(c)) {
      const start = i;
      while (i < s.length && isAlpha(s[i]) && s[i] !== 'π') i++;
      const name = s.slice(start, i);
      if (name === 'pi') return Math.PI;
      if (name === 'e')  return Math.E;
      if (name === 'sqrt') {
        if (peek() !== '(') throw new Error('sqrt expects (');
        i++;
        const arg = parseExpr();
        if (peek() !== ')') throw new Error('expected )');
        i++;
        if (arg < 0) throw new Error('sqrt of negative');
        return Math.sqrt(arg);
      }
      throw new Error('unknown identifier: ' + name);
    }
    throw new Error('unexpected char: ' + c);
  }

  try {
    const result = parseExpr();
    if (i !== s.length) return NaN; // остался «хвост» — выражение некорректно
    return isFinite(result) ? result : NaN;
  } catch (e) {
    return NaN;
  }
}

function applyInterval() {
  const from = parseIntervalValue(intFrom.value);
  const to   = parseIntervalValue(intTo.value);
  intFrom.classList.toggle('invalid', isNaN(from));
  intTo.classList.toggle('invalid', isNaN(to));
  if (isNaN(from) || isNaN(to)) return;
  if (from >= to) {
    // Оба выражения разобрались, но «от» не меньше «до» — тоже некорректно.
    intFrom.classList.add('invalid');
    intTo.classList.add('invalid');
    return;
  }
  // Больше не трогает слайдер ψ — тот теперь независимое окно в один
  // оборот. «От/до» используются только для точек A/B в intervalBounds().
  draw();
}
intFrom.addEventListener('change', applyInterval);
intTo.addEventListener('change', applyInterval);

document.getElementById('interval-unit').addEventListener('click', function() {
  intervalUnit = intervalUnit === 'deg' ? 'rad' : 'deg';
  this.textContent = intervalUnit === 'deg' ? '°' : 'рад';
  // Пересчитываем показанные границы в новую единицу. Введённое выражение
  // (например «π/2») при этом заменяется его десятичным значением —
  // символьная форма через смену единиц не сохраняется.
  if (intervalUnit === 'rad') {
    intFrom.value = (parseIntervalValue(intFrom.value) * Math.PI / 180).toFixed(2);
    intTo.value   = (parseIntervalValue(intTo.value)   * Math.PI / 180).toFixed(2);
  } else {
    intFrom.value = Math.round(parseIntervalValue(intFrom.value) * 180 / Math.PI);
    intTo.value   = Math.round(parseIntervalValue(intTo.value)   * 180 / Math.PI);
  }
  if (intervalOn) draw();
});

// ── Переключатель «Интервал»: точки A/B + бегущий огонёк ──
let intervalOn = false;   // показывать A, B и огонёк
let glowT = 0;            // прогресс огонька 0..1 (A→B)
let glowRaf = 0;

// Границы интервала в радианах (из полей «от/до»)
function intervalBounds() {
  let from = parseIntervalValue(intFrom.value);
  let to   = parseIntervalValue(intTo.value);
  if (isNaN(from) || isNaN(to)) return null;
  if (intervalUnit === 'deg') { from = from*Math.PI/180; to = to*Math.PI/180; }
  return [from, to];
}

function animateGlow() {
  if (glowRaf) return;
  const step = () => {
    if (!intervalOn || !is3D) { glowRaf = 0; return; }
    glowT += 0.002;                 // скорость огонька (медленно)
    if (glowT > 1) glowT = 0;       // циклично: добежал до B → снова от A
    draw();
    glowRaf = requestAnimationFrame(step);
  };
  glowRaf = requestAnimationFrame(step);
}

document.getElementById('interval-title').addEventListener('click', function() {
  intervalOn = !intervalOn;
  this.classList.toggle('active');
  if (intervalOn) { glowT = 0; animateGlow(); }
  draw();
});

// ════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ════════════════════════════════════════════════

function resize() {
  const isDesktop = window.innerWidth >= 768;
  let maxSize;
  if (isDesktop) {
    // Правая панель до 360px + gap 24px + отступы ~48px
    maxSize = Math.min(window.innerWidth - 360 - 24 - 48, window.innerHeight - 48);
  } else {
    maxSize = window.innerWidth - 32;
  }
  W = H = Math.round(Math.max(maxSize, 280));

  // ── Retina-рендеринг ──
  // Физических пикселей на CSS-пиксель (2 на большинстве телефонов, 3 на flagship).
  // Без этого канвас рисуется в низком разрешении и текст/линии выглядят мутными.
  const dpr = window.devicePixelRatio || 1;

  // CSS-размер (логический, для верстки)
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  // Физический размер буфера (в реальных пикселях)
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  // Масштабируем контекст: дальше рисуем в логических координатах, а движок
  // отрисовывает в физическом разрешении → чёткие линии и шрифты.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cx = cy = W / 2;
  R  = W * 0.36;

  // Вертикальный шаг одного оборота в 3D — доля высоты канваса
  ISO.levelGap = H * 0.30;

  // Ширина ячеек изменилась — сбрасываем кэш подбора шрифта,
  // чтобы fitCellValues пересчитал размеры под новую ширину.
  for (const k in lastFitText) delete lastFitText[k];

  draw();
}

// Инициализация текста (заголовок, пояснение, метки) и скрытие 3D-элементов
applyLang();
applyPalette(paletteName);
document.getElementById('interval-row').style.display = 'none';

resize();
window.addEventListener('resize', resize);
</script>
