<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Единичная окружность</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap');

  /* ── Цветовая схема ── */
  :root {
    --bg:      #0d0f14;
    --surface: #13161e;
    --border:  #1e2330;
    --text:    #c8cfe0;
    --dim:     #5a6070;
    --accent:  #7c6dfa;
    --sin:     #3dffa0;
    --cos:     #4db8ff;
    --tan:     #ffaa00;
    --cot:     #ff5fa0;
    --point:   #ff4466;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    user-select: none;
  }

  /* ── Layout ──
     Мобиль (<768px): вертикально
     Десктоп (≥768px): канвас слева | кнопки + значения справа
  ── */
  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    max-width: 1100px;
  }

  .left-panel { display: none; } /* на мобиле скрыта */

  .right-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
  }



  /* ── Канвас ── */
  .canvas-wrapper {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 8px;
    box-shadow: 0 0 60px rgba(124,109,250,0.08), 0 20px 60px rgba(0,0,0,0.5);
    cursor: crosshair;
    touch-action: none;
  }
  canvas { display: block; border-radius: 10px; }

  /* ── Счётчик оборотов ── */
  .lvl-wrap {
    position: absolute;
    bottom: 10px; left: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lvl {
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(124,109,250,0.85);
    background: rgba(13,15,20,0.7);
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid rgba(124,109,250,0.3);
    pointer-events: none;
    letter-spacing: 0.05em;
  }
  .lvl-reset {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 600;
    color: rgba(124,109,250,0.7);
    background: rgba(13,15,20,0.7);
    padding: 4px 8px;
    border-radius: 8px;
    border: 1px solid rgba(124,109,250,0.25);
    cursor: pointer;
    transition: all 0.15s;
  }
  .lvl-reset:hover { border-color: rgba(124,109,250,0.7); color: rgba(124,109,250,1); }

  /* ── Кнопки переключения ── */
  .controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    padding: 10px 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--dim);
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .btn:hover  { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Кнопка языка — в левом верхнем углу канваса */
  .btn-lang {
    position: absolute;
    top: 10px; left: 10px;
    z-index: 2;
    color: rgba(124,109,250,0.85) !important;
    border-color: rgba(124,109,250,0.4) !important;
    font-weight: 600;
  }
  /* Кнопка 2D/3D — в правом нижнем углу канваса */
  .btn-dim {
    position: absolute;
    bottom: 10px; right: 10px;
    z-index: 2;
    color: rgba(124,109,250,0.85) !important;
    border-color: rgba(124,109,250,0.4) !important;
    font-weight: 600;
  }
  /* lang и dim не подсвечиваются при наведении/нажатии/активации */
  .btn-lang:hover, .btn-dim:hover,
  .btn-lang.active, .btn-dim.active {
    background: var(--surface) !important;
    border-color: rgba(124,109,250,0.4) !important;
    color: rgba(124,109,250,0.85) !important;
  }

  /* ── Панель значений ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-top: 16px;
    width: 100%;
    max-width: 500px;
  }
  .stat-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    /* Жёстко фиксируем размер ячейки — не зависит от содержимого */
    height: 80px;
    min-height: 80px;
    max-height: 80px;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .stat-label {
    font-size: 0.62rem;
    color: var(--dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }
  .stat-value {
    font-size: 1rem;
    font-weight: 600;
    color: #e8ecf8;
    white-space: nowrap;
    overflow: hidden;
    line-height: 1.2;
    /* font-size подстраивается в JS под ширину ячейки (fitCellValue) */
  }
  .stat.angle .stat-value { color: var(--accent); }
  .stat.rad   .stat-value { color: #a0b0cc; }
  .stat.sin   .stat-value { color: var(--sin); }
  .stat.cos   .stat-value { color: var(--cos); }
  .stat.tan   .stat-value { color: var(--tan); }
  .stat.cot   .stat-value { color: var(--cot); }
  @media (min-width: 768px) {
    .layout {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 24px;
    }
    .layout .canvas-wrapper { flex-shrink: 0; }

    /* Правая панель: гибкая ширина в комфортном диапазоне.
       Автоподбор шрифта (fitCellValues) гарантирует, что значения влезут. */
    .right-panel {
      flex: 0 1 320px;
      min-width: 260px;
      max-width: 360px;
      align-items: stretch;
      gap: 16px;
    }

    /* На десктопе все 6 ячеек в 2 колонки — каждая шире, метки влезают.
       display:contents растворяет обёртки stat-col, и ячейки попадают
       прямо в grid панели. */
    .stats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width: 100%;
    }
    .stat-col { display: contents; }

    /* Кнопки в колонку, растянуты на всю ширину */
    .controls {
      flex-direction: column;
      align-items: stretch;
      width: 100%;
    }
    .controls .btn {
      width: 100%;
      text-align: left;
    }
  }
  /* ── Заголовок «Блинный торт» и пояснение (только 3D) ── */
  #cake-header {
    text-align: center;
    max-width: 640px;
    margin: 0 auto 4px;
    padding: 0 16px;
  }
  #cake-title {
    font-family: 'Crimson Pro', serif;
    font-size: 1.9rem;
    font-weight: 600;
    color: #e8ecf8;
    margin-bottom: 6px;
  }
  #cake-desc {
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--dim);
  }
  #cake-desc b { color: var(--sin); font-weight: 600; }

  /* ── Столбец канваса + слайдер ── */
  .canvas-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 500px;
    padding: 0 4px;
  }
  .slider-label {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--dim);
    flex-shrink: 0;
  }
  .angle-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 3px;
    background: var(--border);
    outline: none;
  }
  .angle-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--sin);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(61,255,160,0.4);
  }
  .angle-slider::-moz-range-thumb {
    width: 18px; height: 18px;
    border: none;
    border-radius: 50%;
    background: var(--sin);
    cursor: pointer;
  }

  /* ── Режим «Интервал» ── */
  .interval-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 4px;
  }
  .interval-title {
    font-size: 0.72rem;
    color: var(--dim);
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .interval-title:hover { border-color: var(--accent); color: var(--accent); }
  .interval-title.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .interval-lbl { font-size: 0.72rem; color: var(--dim); }
  .interval-inp {
    width: 56px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 600;
    text-align: center;
    color: var(--point);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 4px;
    outline: none;
    -moz-appearance: textfield;
  }
  .interval-inp::-webkit-outer-spin-button,
  .interval-inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .interval-inp:focus { border-color: var(--accent); }
  .interval-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    color: var(--dim);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .interval-unit:hover { border-color: var(--accent); color: var(--accent); }
  /* Стрелки вертикального перемещения камеры (только 3D) */
  .cam-arrows {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 2;
  }
  .cam-btn {
    width: 38px; height: 38px;
    font-size: 0.9rem;
    color: rgba(124,109,250,0.85);
    background: rgba(13,15,20,0.7);
    border: 1px solid rgba(124,109,250,0.4);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .cam-btn:hover, .cam-btn:active {
    background: rgba(124,109,250,0.2);
    border-color: rgba(124,109,250,0.8);
    color: #fff;
  }
</style>
</head>
<body>

<!-- Заголовок и пояснение — видны только в 3D -->
<div id="cake-header" style="display:none">
  <h1 id="cake-title">Блинный торт</h1>
  <p id="cake-desc"></p>
</div>

<div class="layout">

<!-- Левый столбец: канвас + слайдер -->
<div class="canvas-col">
<!-- Канвас -->
<div class="canvas-wrapper" id="wrapper">
  <div class="lvl-wrap">
    <div class="lvl" id="lvl-counter">lvl: 0</div>
    <button class="lvl-reset" id="btn-reset">reset</button>
  </div>
  <button class="lvl-reset btn-lang" id="btn-lang">EN</button>
  <button class="lvl-reset btn-dim" id="btn-dim">3D</button>
  <div class="cam-arrows" id="cam-arrows" style="display:none">
    <button class="cam-btn" id="cam-up">▲</button>
    <button class="cam-btn" id="cam-down">▼</button>
  </div>
  <canvas id="c"></canvas>
</div>

<!-- Слайдер угла ψ -->
<div class="slider-row">
  <span class="slider-label">ψ</span>
  <input type="range" id="angle-slider" class="angle-slider" min="-450" max="450" step="1" value="30">
</div>
</div><!-- end canvas-col -->

<!-- Правая панель: кнопки + значения -->
<div class="right-panel">
  <div class="controls">
    <button class="btn" id="btn-sin">sin и cos</button>
    <button class="btn" id="btn-tan">tan</button>
    <button class="btn" id="btn-cot">cot</button>
    <button class="btn" id="btn-labels">метки углов</button>
    <button class="btn" id="btn-coords">координаты</button>
    <button class="btn btn-mode3d" id="btn-mode3d" style="display:none">блины / спираль</button>
  </div>


  <div class="stats">
    <div class="stat-col">
      <div class="stat angle"><div class="stat-label" data-i18n="deg">Угол ψ °</div>  <div class="stat-value" id="v-deg">30</div></div>
      <div class="stat rad">  <div class="stat-label" data-i18n="rad">Угол ψ рад</div><div class="stat-value" id="v-rad">π/6</div></div>
    </div>
    <div class="stat-col">
      <div class="stat sin" id="cell-sin"><div class="stat-label">sin ψ</div><div class="stat-value" id="v-sin">1/2</div></div>
      <div class="stat cos" id="cell-cos"><div class="stat-label">cos ψ</div><div class="stat-value" id="v-cos">√3/2</div></div>
    </div>
    <div class="stat-col">
      <div class="stat tan" id="cell-tan"><div class="stat-label">tan ψ</div><div class="stat-value" id="v-tan">1/√3</div></div>
      <div class="stat cot" id="cell-cot"><div class="stat-label">cot ψ</div><div class="stat-value" id="v-cot">√3</div></div>
    </div>
  </div>

  <!-- Режим «Интервал» — задаёт диапазон углов для слайдера/спирали -->
  <div class="interval-row" id="interval-row">
    <span class="interval-title" id="interval-title">Интервал</span>
    <span class="interval-lbl" id="interval-from-lbl">от</span>
    <input type="number" id="interval-from" class="interval-inp" value="-450">
    <span class="interval-lbl" id="interval-to-lbl">до</span>
    <input type="number" id="interval-to" class="interval-inp" value="450">
    <button class="interval-unit" id="interval-unit">°</button>
  </div>
</div><!-- end right-panel -->

</div><!-- end layout -->

<script>
'use strict';

// ════════════════════════════════════════════════
//  КОНСТАНТЫ

// Строки шрифтов — чтобы не писать длинные литералы повторно
const FONT_ITALIC = "italic 600 13px 'Crimson Pro', serif";
const FONT_MONO   = "500 11px 'JetBrains Mono', monospace";
// ════════════════════════════════════════════════

// Табличные углы: [значение в радианах, строковая метка].
// Используются для подписей, засечек на окружности и snap-вибрации.
const SPECIAL = [
  [0,'0'],
  [Math.PI/6,'π/6'], [Math.PI/4,'π/4'], [Math.PI/3,'π/3'],
  [Math.PI/2,'π/2'], [2*Math.PI/3,'2π/3'], [3*Math.PI/4,'3π/4'],
  [5*Math.PI/6,'5π/6'], [Math.PI,'π'],
  [7*Math.PI/6,'7π/6'], [5*Math.PI/4,'5π/4'], [4*Math.PI/3,'4π/3'],
  [3*Math.PI/2,'3π/2'], [5*Math.PI/3,'5π/3'], [7*Math.PI/4,'7π/4'],
  [11*Math.PI/6,'11π/6'], [2*Math.PI,'2π'],
];

// Точные значения тригонометрических функций в табличных углах.
// Отображаются вместо десятичных приближений (например, «√3/2» вместо «0.866»).
const TRIG_VALS = {
  sin: {'0':'0','π/6':'1/2','π/4':'√2/2','π/3':'√3/2','π/2':'1',
        '2π/3':'√3/2','3π/4':'√2/2','5π/6':'1/2','π':'0',
        '7π/6':'−1/2','5π/4':'−√2/2','4π/3':'−√3/2','3π/2':'−1',
        '5π/3':'−√3/2','7π/4':'−√2/2','11π/6':'−1/2','2π':'0'},
  cos: {'0':'1','π/6':'√3/2','π/4':'√2/2','π/3':'1/2','π/2':'0',
        '2π/3':'−1/2','3π/4':'−√2/2','5π/6':'−√3/2','π':'−1',
        '7π/6':'−√3/2','5π/4':'−√2/2','4π/3':'−1/2','3π/2':'0',
        '5π/3':'1/2','7π/4':'√2/2','11π/6':'√3/2','2π':'1'},
  tan: {'0':'0','π/6':'1/√3','π/4':'1','π/3':'√3','π/2':'∞',
        '2π/3':'−√3','3π/4':'−1','5π/6':'−1/√3','π':'0',
        '7π/6':'1/√3','5π/4':'1','4π/3':'√3','3π/2':'∞',
        '5π/3':'−√3','7π/4':'−1','11π/6':'−1/√3','2π':'0'},
  cot: {'0':'∞','π/6':'√3','π/4':'1','π/3':'1/√3','π/2':'0',
        '2π/3':'−1/√3','3π/4':'−1','5π/6':'−√3','π':'∞',
        '7π/6':'√3','5π/4':'1','4π/3':'1/√3','3π/2':'0',
        '5π/3':'−1/√3','7π/4':'−1','11π/6':'−√3','2π':'∞'},
};

// Предвычисленные данные для меток и засечек.
// Фильтруем 0 и 2π (совпадают на окружности), считаем cos/sin один раз.
const TICK_DATA = SPECIAL
  .filter(([a]) => a !== 0 && a !== 2*Math.PI)
  .map(([a, label]) => [Math.cos(a), Math.sin(a), label]);

// ════════════════════════════════════════════════
//  СОСТОЯНИЕ ПРИЛОЖЕНИЯ
// ════════════════════════════════════════════════

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');

// DOM-элементы кэшируются один раз при загрузке —
// document.getElementById дорог при вызове в каждом кадре
const DOM = {
  deg:  document.getElementById('v-deg'),
  rad:  document.getElementById('v-rad'),
  sin:  document.getElementById('v-sin'),
  cos:  document.getElementById('v-cos'),
  tan:  document.getElementById('v-tan'),
  cot:  document.getElementById('v-cot'),
  lvl:  document.getElementById('lvl-counter'),
};

// Геометрия канваса (пересчитывается при resize)
let W, H, cx, cy, R;

// Текущий угол ψ (накапливается за пределы [0, 2π] при оборотах)
let angle = Math.PI / 6; // начальное значение: 30°

// Флаги видимости слоёв (по умолчанию всё выключено)
let showSin    = false;  // отрезки sin/cos на осях координат
let showCoords = false;  // прямоугольный треугольник (взаимоисключает showSin)
let showTan    = false;  // ось тангенсов (x = 1)
let showCot    = false;  // ось котангенсов (y = 1)
let showLabels = false;  // подписи табличных углов на окружности

// ── 3D-режим «спираль» ──
// is3D: показывать угол как винтовую линию по вертикали (обороты = высота).
// Плоская окружность — основной вид; кнопка «спираль» уводит в 3D и обратно.
let is3D = false;

// Счётчик полных оборотов (CCW → положительный, CW → отрицательный)
let lvl = 0;

// Переменные для отслеживания оборотов при перетаскивании
let dragging      = false;
let prevRawAngle  = null; // предыдущий atan2 ∈ (-π, π]
let prevNormAngle = null; // предыдущий нормализованный угол ∈ [0, 2π)
let revolutions   = 0;   // накопленные полуобороты (каждое пересечение ±π = 1)
let lastSpecial   = null; // последний snap-угол (для однократной вибрации)

// Координаты точки на окружности (обновляются в draw())
let px = 0, py = 0;

// ════════════════════════════════════════════════
//  МАТЕМАТИЧЕСКИЕ УТИЛИТЫ
// ════════════════════════════════════════════════

// Нормализует угол в диапазон [0, 2π)
function normalizeAngle(a) {
  a = a % (2 * Math.PI);
  return a < 0 ? a + 2 * Math.PI : a;
}

// Возвращает строковую метку, если угол близок к табличному (±0.015 рад ≈ 0.86°).
// Иначе возвращает null.
function findSpecial(a) {
  const norm = normalizeAngle(a);
  for (const [val, label] of SPECIAL)
    if (Math.abs(norm - val) < 0.015) return label;
  return null;
}

// Форматирует значение тригонометрической функции:
// — табличный угол → точная дробь из TRIG_VALS («√3/2»)
// — ∞ (tan/cot в особых точках) → «∞»
// — иначе → десятичное с 3 знаками
function fmt(value, fnName, specialLabel) {
  if (specialLabel && TRIG_VALS[fnName]?.[specialLabel] !== undefined)
    return TRIG_VALS[fnName][specialLabel];
  if (!isFinite(value) || Math.abs(value) > 999) return '∞';
  return value.toFixed(3);
}

// Форматирует угол в радианах для панели значений.
// При многократных оборотах добавляет компактный суффикс ±n·2π.
function radLabel(a) {
  const norm = normalizeAngle(a);
  const base = findSpecial(a) || norm.toFixed(2); // 2 знака — компактнее
  if (lvl === 0) return base;
  if (lvl  > 0)  return base + '+' + lvl + '·2π';
  const sp = findSpecial(a);
  if (sp) return sp + '−' + Math.abs(lvl) + '·2π';
  return norm.toFixed(2) + '−' + Math.abs(lvl) + '·2π';
}

// ════════════════════════════════════════════════
//  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ РИСОВАНИЯ
// ════════════════════════════════════════════════

// Рисует стрелку в конце оси: dir='r' — вправо, dir='u' — вверх
function drawArrow(x, y, dir) {
  ctx.beginPath();
  if (dir === 'r') { ctx.moveTo(x,y); ctx.lineTo(x-7,y-4); ctx.lineTo(x-7,y+4); }
  if (dir === 'u') { ctx.moveTo(x,y); ctx.lineTo(x-4,y+7); ctx.lineTo(x+4,y+7); }
  ctx.closePath();
  ctx.fill();
}

// Рисует пунктир вдоль направления радиуса до вертикальной прямой x = targetX.
// Геометрически: находим t такое, что cx + t*(px-cx) = targetX, берём y = cy + t*(py-cy).
function dashedToVertical(targetX, color) {
  if (Math.abs(px - cx) < 1) return;
  const t    = (targetX - cx) / (px - cx);
  const intY = cy + t * (py - cy);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(targetX, intY); ctx.stroke();
  ctx.setLineDash([]);
}

// Рисует пунктир вдоль направления радиуса до горизонтальной прямой y = targetY.
// Геометрически: находим t такое, что cy + t*(py-cy) = targetY, берём x = cx + t*(px-cx).
function dashedToHorizontal(targetY, color) {
  if (Math.abs(py - cy) < 1) return;
  const t    = (targetY - cy) / (py - cy);
  const intX = cx + t * (px - cx);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(intX, targetY); ctx.stroke();
  ctx.setLineDash([]);
}

// Рисует дугу в математически корректном направлении.
// Canvas имеет перевёрнутую ось Y, поэтому:
//   CCW в математике = anticlockwise:true в canvas (угол end = -norm)
//   CW  в математике = anticlockwise:false в canvas (угол end = 2π - norm)
function drawArc(radius, norm) {
  ctx.beginPath();
  if (lvl >= 0) {
    ctx.arc(cx, cy, radius, 0, -norm, true);  // CCW
  } else {
    const cw = (2 * Math.PI - norm) % (2 * Math.PI);
    ctx.arc(cx, cy, radius, 0, cw || 0, false); // CW
  }
  ctx.stroke();
}

// ════════════════════════════════════════════════
//  3D-РЕЖИМ «БЛИННЫЙ ТОРТ» (винтовая линия оборотов)
// ════════════════════════════════════════════════
//
// Обычная окружность плоская — ψ и ψ+2π попадают в одну точку.
// Здесь обороты «разматываются» по вертикали: за каждый полный оборот (2π)
// точка поднимается (CCW) или опускается (CW) на уровень — «блин» выше/ниже.
// Точка на плоскости всюду та же, блин другой.
//
// Два вида: «блины» — дискретные диски на целых уровнях (нагляднее);
//           «спираль» — непрерывная винтовая поверхность (точнее).

const ISO = { tilt: 0.42, levelGap: 0, camY: 0 }; // camY — сдвиг камеры по вертикали (px)

// Анимация камеры: current плавно едет к target (= lvl) при появлении блина.
const camAnim = { current: 0, target: 0, raf: 0 };

// Анимация рождения витка. birthAnim.lvl — рождающийся виток; t: 0→1.
// reachedHi/reachedLo — самый дальний нарисованный уровень вверх/вниз:
// пока не превышен, повторный вход в виток не запускает анимацию.
// Уровень 0 — особый случай: он единственный, чья геометрия (aStart=0)
// физически пропадает из рельсов, когда lvl уходит в минус (aEnd=lvl·2π
// не включает положительный диапазон). Поэтому 0 рождается кольцом
// заново ТОЛЬКО при возврате с отрицательной стороны — не при спуске
// с положительной (1→0 и т.п., где 0 никогда не исчезал с экрана).
const birthAnim = { t: 1, lvl: 0, raf: 0, pause: 0, reachedHi: 0, reachedLo: 0 };
let prevSpiralLvl = 0; // предыдущий lvl в режиме спирали — для детекта возврата с минуса
function startBirthTurn(newLvl) {
  birthAnim.t = 0;
  birthAnim.lvl = newLvl;
  birthAnim.pause = 28;
  if (birthAnim.raf) cancelAnimationFrame(birthAnim.raf);
  const step = () => {
    if (birthAnim.pause > 0) birthAnim.pause--;
    else birthAnim.t += 0.035;
    if (birthAnim.t >= 1) { birthAnim.t = 1; birthAnim.raf = 0; draw(); return; }
    draw();
    birthAnim.raf = requestAnimationFrame(step);
  };
  birthAnim.raf = requestAnimationFrame(step);
}

// Запускает плавный переезд камеры к целевому уровню.
function animateCamera() {
  if (camAnim.raf) return; // уже анимируется
  const step = () => {
    const diff = camAnim.target - camAnim.current;
    if (Math.abs(diff) < 0.001) {
      camAnim.current = camAnim.target;
      camAnim.raf = 0;
      draw();
      return;
    }
    camAnim.current += diff * 0.03; // ещё мягче: чем меньше, тем плавнее
    draw();
    camAnim.raf = requestAnimationFrame(step);
  };
  camAnim.raf = requestAnimationFrame(step);
}
let spiralMode = false; // false = блины (дискретно), true = спираль (непрерывно)

// Палитра «торта» (по скриншотам)
const CAKE = {
  fill:      'rgba(180,130,74,0.42)',   // тёплая коричневая заливка блина (верх)
  fillHi:    'rgba(200,150,88,0.55)',   // текущий блин чуть ярче
  side:      'rgba(140,98,52,0.55)',    // боковая стенка блина (темнее верха)
  sideHi:    'rgba(165,118,64,0.62)',   // боковая стенка текущего блина
  ring:      '#e88a7e',                 // ЕДИНЫЙ цвет всех окружностей/колец (тёплый коралл)
  rim:       'rgba(217,167,96,0.9)',    // (не используется для колец — оставлено для совместимости)
  ringCur:   '#f2646f',
  ringBase:  'rgba(91,143,199,0.9)',
  vline:     'rgba(217,154,78,0.9)',    // вертикаль «один угол, разные обороты»
  vdot:      '#c8853f',                 // точки на вертикали (блины)
  level:     'rgba(94,234,212,0.85)',   // шкала уровней — бирюзовая
  axis:      'rgba(150,160,180,0.5)',   // оси x/y
};

// Проецирует 3D-точку окружности (x,y ∈[-1..1], z — высота px) на экран.
//
// Изометрия: ось x окружности направлена вправо-назад, ось y — влево-назад
// (как на скриншотах). Это поворот плоскости на 45° перед наклоном:
//   экранный_право  = (x - y)/√2   — горизонталь
//   «глубина»       = (x + y)/√2   — уходит вверх-назад (сжата наклоном)
// Тогда точка (1;0) [угол 0°] ложится точно на конец оси x (вправо-назад),
// а не вбок по горизонтали.
const SQRT1_2 = Math.SQRT1_2; // 1/√2
function project(x, y, z, ox, oy, r) {
  const sx = (x - y) * SQRT1_2;   // вправо по экрану
  const sy = (x + y) * SQRT1_2;   // назад/вверх (глубина)
  return [ ox + sx * r, oy - sy * r * ISO.tilt - z ];
}

// Путь эллипса-блина на высоте z (без отрисовки — для fill/stroke снаружи)
function pancakePath(ox, oy, r, z) {
  ctx.beginPath();
  const steps = 72;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps * 2 * Math.PI;
    const [sx, sy] = project(Math.cos(t), Math.sin(t), z, ox, oy, r);
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  }
}

function draw3D() {
  ctx.clearRect(0, 0, W, H);

  const ox = W / 2, r = W * 0.28, gap = ISO.levelGap;
  const turns   = angle / (2 * Math.PI);

  // Рождение витка: только для впервые достигнутого уровня (за пределами
  // reachedHi/reachedLo). Уровень 0 — «домашняя точка»: каждый приход в неё
  // обнуляет память о пройденных уровнях (независимо от стороны прихода),
  // поэтому повторный такой же поход снова покажет рождение колец. Само
  // кольцо 0 при этом рождается заново только если пришли с отрицательного
  // lvl — только тогда оно физически не рисовалось (см. комментарий выше).
  if (spiralMode) {
    if (lvl === 0) {
      if (prevSpiralLvl < 0) {
        startBirthTurn(0);
      } else if (birthAnim.lvl !== 0) {
        birthAnim.lvl = 0; birthAnim.t = 1;
      }
      birthAnim.reachedHi = 0;
      birthAnim.reachedLo = 0;
    } else if (lvl > birthAnim.reachedHi) {
      birthAnim.reachedHi = lvl;
      startBirthTurn(lvl);
    } else if (lvl < birthAnim.reachedLo) {
      birthAnim.reachedLo = lvl;
      startBirthTurn(lvl);
    } else if (lvl !== birthAnim.lvl) {
      // Уже пройденная территория в рамках текущего похода — без анимации.
      birthAnim.lvl = lvl;
      birthAnim.t = 1;
    }
    prevSpiralLvl = lvl;
  }

  // Камера следует за точкой:
  //  — в блинах: дискретно, плавный переезд при смене lvl (появлении блина);
  //  — в спирали: непрерывно едет за высотой намотки (turns), без рывков.
  if (spiralMode) {
    // непрерывное слежение: цель = текущая высота в оборотах
    camAnim.target = turns;
    camAnim.current += (camAnim.target - camAnim.current) * 0.12;
    if (Math.abs(camAnim.target - camAnim.current) < 0.001) {
      camAnim.current = camAnim.target;
    } else if (!camAnim.raf) {
      // догоняем цель даже если угол больше не меняется
      camAnim.raf = requestAnimationFrame(() => { camAnim.raf = 0; draw(); });
    }
  } else {
    // дискретно: цель = уровень, плавный переезд запускает animateCamera
    if (camAnim.target !== lvl) { camAnim.target = lvl; animateCamera(); }
  }

  const oy = H * 0.54 + camAnim.current * gap + ISO.camY;
  // Уровень блина = счётчик оборотов lvl (тот же, что в 2D).
  // lvl меняется при прохождении точки через (1;0) — угол 0°/360°.
  // Так блин появляется ровно в тот же момент, что растёт lvl.
  const curLvl  = lvl;
  let loLevel = Math.min(0, curLvl); // от базовой плоскости
  let hiLevel = Math.max(0, curLvl); // до текущего оборота

  // В режиме «Интервал» показываем все блины между уровнями A и B.
  if (intervalOn) {
    const b = intervalBounds();
    if (b) {
      const aLvl = Math.floor(b[0] / (2*Math.PI));
      const bLvl = Math.floor(b[1] / (2*Math.PI));
      loLevel = Math.min(loLevel, aLvl, bLvl);
      hiLevel = Math.max(hiLevel, aLvl, bLvl);
    }
  }

  // В режиме «блины» точка сидит на дискретном уровне (телепорт при 360°),
  // в режиме «спираль» — плавно едет по винтовой линии.
  const zPoint = spiralMode ? turns * gap : curLvl * gap;

  // Сохраняем геометрию 3D для обратной проекции при перетаскивании.
  // centerY — ФИКСИРОВАННЫЙ экранный центр (куда садится активный блин).
  // Не зависит от lvl и анимации камеры → при появлении блина драг не дёргается.
  ISO.ox = ox; ISO.oy = oy; ISO.r = r; ISO.zCenter = zPoint;
  ISO.centerY = H * 0.54 + ISO.camY;

  // ── Вертикальная ось Z (уровни) со шкалой ──
  // Фиксированная позиция слева (screen-x), а не в наклонной плоскости —
  // так шкала всегда у левого края и не наезжает на блины.
  const scaleX = 34; // отступ от левого края канваса
  const levelScreenY = lv => oy - lv * gap; // экранная Y уровня (z вверх)
  ctx.strokeStyle = '#2a3040'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(scaleX, levelScreenY(hiLevel));
  ctx.lineTo(scaleX, levelScreenY(loLevel));
  ctx.stroke();
  ctx.font = "600 12px 'JetBrains Mono', monospace";
  ctx.textAlign = 'right';
  for (let lv = loLevel; lv <= hiLevel; lv++) {
    const my = levelScreenY(lv);
    ctx.strokeStyle = CAKE.level;
    ctx.beginPath(); ctx.moveTo(scaleX - 6, my); ctx.lineTo(scaleX + 6, my); ctx.stroke();
    ctx.fillStyle = CAKE.level;
    ctx.fillText(lv, scaleX - 11, my + 4);
  }
  ctx.textAlign = 'left';

  if (spiralMode) {
    drawSpiralBody(ox, oy, r, gap, turns);
  } else {
    drawPancakes(ox, oy, r, gap, loLevel, hiLevel, curLvl);
  }

  // ── Оси X, Y на уровне точки ──
  // project уже разворачивает плоскость: (1,0) → вправо-назад, (0,1) → влево-назад.
  const [x0, y0]   = project(0, 0, zPoint, ox, oy, r);
  const [xxE, xyE] = project(1.32, 0, zPoint, ox, oy, r);   // x: вправо-назад
  const [yxE, yyE] = project(0, 1.32, zPoint, ox, oy, r);   // y: влево-назад
  const [xFx, xFy] = project(-1.32, 0, zPoint, ox, oy, r);  // −x: влево-вперёд
  const [yFx, yFy] = project(0, -1.32, zPoint, ox, oy, r);  // −y: вправо-вперёд
  ctx.strokeStyle = CAKE.axis; ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  ctx.beginPath(); ctx.moveTo(xFx, xFy); ctx.lineTo(xxE, xyE); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(yFx, yFy); ctx.lineTo(yxE, yyE); ctx.stroke();
  ctx.setLineDash([]);
  drawArrowHead(xxE, xyE, x0, y0);
  drawArrowHead(yxE, yyE, x0, y0);
  ctx.fillStyle = '#8a95b0'; ctx.font = FONT_ITALIC;
  ctx.fillText('x', xxE + 6, xyE - 2);
  ctx.fillText('y', yxE - 16, yyE - 2);

  const vx = Math.cos(angle), vy = Math.sin(angle);

  // Диапазон высот, который реально занимает рисунок (блины или спираль).
  // В спирали спираль может уходить за уровни блинов — берём по фактической намотке.
  let zLoDraw = loLevel * gap, zHiDraw = hiLevel * gap;
  if (spiralMode) {
    let aS = 0, aE = angle;
    if (intervalOn) {
      const bb = intervalBounds();
      if (bb) { aS = Math.min(bb[0], bb[1], angle); aE = Math.max(bb[0], bb[1], angle); }
    }
    const zA = (aS/(2*Math.PI))*gap, zB = (aE/(2*Math.PI))*gap;
    zLoDraw = Math.min(zLoDraw, zA, zB);
    zHiDraw = Math.max(zHiDraw, zA, zB);
  }

  // ── Серая вертикаль в точке (1;0) на весь диапазон рисунка ──
  {
    const [g1x, g1y] = project(1, 0, zHiDraw, ox, oy, r);
    const [g2x, g2y] = project(1, 0, zLoDraw, ox, oy, r);
    ctx.strokeStyle = CAKE.axis; ctx.lineWidth = 1;
    ctx.setLineDash([4, 5]);
    ctx.beginPath(); ctx.moveTo(g1x, g1y); ctx.lineTo(g2x, g2y); ctx.stroke();
    ctx.setLineDash([]);
    // еле заметная метка точки (1;0) на каждом витке
    ctx.fillStyle = 'rgba(170,180,200,0.65)';
    for (let lv = loLevel; lv <= hiLevel; lv++) {
      const [mx, my] = project(1, 0, lv * gap, ox, oy, r);
      ctx.beginPath(); ctx.arc(mx, my, 2.8, 0, 2*Math.PI); ctx.fill();
    }
  }

  // ── Вертикаль «один угол — разные обороты» на весь диапазон рисунка ──
  const [vTopX, vTopY] = project(vx, vy, zHiDraw, ox, oy, r);
  const [vBotX, vBotY] = project(vx, vy, zLoDraw, ox, oy, r);
  ctx.strokeStyle = CAKE.vline; ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(vTopX, vTopY); ctx.lineTo(vBotX, vBotY); ctx.stroke();
  ctx.setLineDash([]);
  // Точки-блины на вертикали + подпись угла — только в режиме блинов
  // (в спирали точка едет по непрерывной винтовой, дискретных уровней нет).
  if (!spiralMode) {
    const baseDeg = Math.round(normalizeAngle(angle) * 180 / Math.PI);
    ctx.font = "600 11px 'JetBrains Mono', monospace";
    for (let lv = loLevel; lv <= hiLevel; lv++) {
      const [dx, dy] = project(vx, vy, lv * gap, ox, oy, r);
      const isCur = (lv === curLvl);
      ctx.globalAlpha = isCur ? 1 : 0.4;
      ctx.beginPath(); ctx.arc(dx, dy, 3.5, 0, 2*Math.PI);
      ctx.fillStyle = CAKE.vdot; ctx.fill();
      const degOnLvl = baseDeg + lv * 360;
      ctx.fillStyle = 'rgba(230,200,150,0.95)';
      ctx.fillText(degOnLvl + '°', dx + 18, dy - 6);
    }
    ctx.globalAlpha = 1;
  }

  // ── Метки табличных углов на текущем блине ──
  if (showLabels) {
    ctx.font = "10px 'JetBrains Mono', monospace";
    ctx.fillStyle = '#7a8500';
    ctx.fillStyle = 'rgba(150,160,120,0.7)';
    for (const [tx, ty, label] of TICK_DATA) {
      const [lx, ly] = project(tx * 1.18, ty * 1.18, zPoint, ox, oy, r);
      ctx.fillText(label, lx - ctx.measureText(label).width/2, ly + 4);
    }
    // короткие засечки на окружности блина
    ctx.strokeStyle = 'rgba(150,160,180,0.4)'; ctx.lineWidth = 1.2;
    for (const [tx, ty] of TICK_DATA) {
      const [ax, ay] = project(tx * 0.95, ty * 0.95, zPoint, ox, oy, r);
      const [bx, by] = project(tx * 1.05, ty * 1.05, zPoint, ox, oy, r);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
  }

  const cosA0 = Math.cos(angle), sinA0 = Math.sin(angle);

  // ── Ось тангенсов (касательная x=1 на текущем блине) ──
  if (showTan && Math.abs(cosA0) > 0.008) {
    const tanV = sinA0 / cosA0;
    const [t1x, t1y] = project(1, -1.3, zPoint, ox, oy, r);
    const [t2x, t2y] = project(1,  1.3, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,170,0,0.4)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(t1x,t1y); ctx.lineTo(t2x,t2y); ctx.stroke();
    ctx.setLineDash([]);
    // пунктир вдоль радиуса от точки до пересечения с осью x=1
    const [prx, pry] = project(cosA0, sinA0, zPoint, ox, oy, r);
    const [ix, iy]   = project(1, tanV, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,170,0,0.3)'; ctx.lineWidth = 1;
    ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.moveTo(prx, pry); ctx.lineTo(ix, iy); ctx.stroke();
    ctx.setLineDash([]);
    drawArrowHead(t2x, t2y, t1x, t1y);
    ctx.fillStyle = 'rgba(255,170,0,0.95)'; ctx.font = FONT_ITALIC;
    ctx.fillText('tan ψ', t2x + 6, t2y);
    const tv = Math.max(-1.3, Math.min(1.3, tanV));
    const [ta,tb] = project(1, 0, zPoint, ox, oy, r);
    const [tc,td] = project(1, tv, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,170,0,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ta,tb); ctx.lineTo(tc,td); ctx.stroke();
  }

  // ── Ось котангенсов (касательная y=1 на текущем блине) ──
  if (showCot && Math.abs(sinA0) > 0.008) {
    const cotV = cosA0 / sinA0;
    const [c1x, c1y] = project(-1.3, 1, zPoint, ox, oy, r);
    const [c2x, c2y] = project( 1.3, 1, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,95,160,0.4)'; ctx.lineWidth = 1.5;
    ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(c1x,c1y); ctx.lineTo(c2x,c2y); ctx.stroke();
    ctx.setLineDash([]);
    // пунктир вдоль радиуса от точки до пересечения с осью y=1
    const [prx, pry] = project(cosA0, sinA0, zPoint, ox, oy, r);
    const [ix, iy]   = project(cotV, 1, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,95,160,0.3)'; ctx.lineWidth = 1;
    ctx.setLineDash([3,5]);
    ctx.beginPath(); ctx.moveTo(prx, pry); ctx.lineTo(ix, iy); ctx.stroke();
    ctx.setLineDash([]);
    drawArrowHead(c2x, c2y, c1x, c1y);
    ctx.fillStyle = 'rgba(255,95,160,0.95)'; ctx.font = FONT_ITALIC;
    ctx.fillText('cot ψ', c2x + 6, c2y);
    const cv = Math.max(-1.3, Math.min(1.3, cotV));
    const [ca,cb] = project(0, 1, zPoint, ox, oy, r);
    const [cc,cd] = project(cv, 1, zPoint, ox, oy, r);
    ctx.strokeStyle = 'rgba(255,95,160,0.95)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ca,cb); ctx.lineTo(cc,cd); ctx.stroke();
  }

  // ── Режим «координаты»: прямоугольный треугольник + подписи ──
  if (showCoords) {
    const [ptX, ptY] = project(cosA0, sinA0, zPoint, ox, oy, r);
    const [ftX, ftY] = project(cosA0, 0, zPoint, ox, oy, r);
    const [orX, orY] = project(0, 0, zPoint, ox, oy, r);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#4db8ff'; // cos — катет по x
    ctx.beginPath(); ctx.moveTo(orX,orY); ctx.lineTo(ftX,ftY); ctx.stroke();
    ctx.strokeStyle = '#3dffa0'; // sin — катет по y
    ctx.beginPath(); ctx.moveTo(ftX,ftY); ctx.lineTo(ptX,ptY); ctx.stroke();
    ctx.font = FONT_ITALIC;
    ctx.fillStyle = '#4db8ff';
    ctx.fillText('cos ψ', (orX+ftX)/2 - 14, (orY+ftY)/2 + 14);
    ctx.fillStyle = '#3dffa0';
    ctx.fillText('sin ψ', (ftX+ptX)/2 + 6, (ftY+ptY)/2);
  }

  // ── Серая дуга пройденного угла ──
  // На пройденных блинах (полный оборот уже намотан) — полная серая окружность.
  // На текущем блине — дуга от 0° до ψ (в нужном направлении, как в 2D).
  if (!spiralMode) {
    ctx.strokeStyle = 'rgba(190,196,222,0.95)'; ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    // Полные серые окружности — на ПОЛНОСТЬЮ пройденных блинах (в обе стороны).
    // Пройденный диапазон углов = [min(0,angle), max(0,angle)].
    // Блин L «полный», если весь его оборот [L·2π, (L+1)·2π] попал в этот диапазон.
    const sweptLo = Math.min(0, angle);
    const sweptHi = Math.max(0, angle);
    for (let L = Math.floor(sweptLo / (2*Math.PI)); L <= Math.ceil(sweptHi / (2*Math.PI)); L++) {
      const blinLo = L * 2*Math.PI, blinHi = (L + 1) * 2*Math.PI;
      if (blinLo >= sweptLo - 1e-9 && blinHi <= sweptHi + 1e-9) {
        const z = L * gap;
        ctx.beginPath();
        for (let i = 0; i <= 72; i++) {
          const a = i/72 * 2*Math.PI;
          const [ax, ay] = project(Math.cos(a), Math.sin(a), z, ox, oy, r);
          if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
        }
        ctx.stroke();
      }
    }
    // частичная дуга на текущем блине
    const arcNorm = normalizeAngle(angle);
    const arcSweep = (lvl >= 0) ? arcNorm : -((2*Math.PI - arcNorm) % (2*Math.PI));
    ctx.beginPath();
    const arcSteps = Math.max(2, Math.round(Math.abs(arcSweep) / (2*Math.PI) * 72));
    for (let i = 0; i <= arcSteps; i++) {
      const a = arcSweep * i / arcSteps;
      const [ax, ay] = project(Math.cos(a), Math.sin(a), zPoint, ox, oy, r);
      if (i === 0) ctx.moveTo(ax, ay); else ctx.lineTo(ax, ay);
    }
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  // ── Радиус-вектор + точка A на её уровне ──
  const [cxp, cyp] = project(0, 0, zPoint, ox, oy, r);
  const [pxp, pyp] = project(vx, vy, zPoint, ox, oy, r);
  ctx.strokeStyle = 'rgba(190,196,222,0.95)'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cxp, cyp); ctx.lineTo(pxp, pyp); ctx.stroke();

  // sin/cos — отрезки НА ОСЯХ блина (как в 2D): cos вдоль оси x, sin вдоль оси y.
  if (showSin) {
    const [cosEndX, cosEndY] = project(vx, 0, zPoint, ox, oy, r); // конец cos на оси x
    const [sinEndX, sinEndY] = project(0, vy, zPoint, ox, oy, r); // конец sin на оси y
    // отрезок cos на оси x
    ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.strokeStyle = '#4db8ff';
    ctx.beginPath(); ctx.moveTo(cxp, cyp); ctx.lineTo(cosEndX, cosEndY); ctx.stroke();
    // отрезок sin на оси y
    ctx.strokeStyle = '#3dffa0';
    ctx.beginPath(); ctx.moveTo(cxp, cyp); ctx.lineTo(sinEndX, sinEndY); ctx.stroke();
    ctx.lineCap = 'butt';
    // пунктирные проекции от точки к осям
    ctx.lineWidth = 1; ctx.setLineDash([3,5]);
    ctx.strokeStyle = 'rgba(77,184,255,0.35)';
    ctx.beginPath(); ctx.moveTo(pxp, pyp); ctx.lineTo(cosEndX, cosEndY); ctx.stroke(); // к оси x
    ctx.strokeStyle = 'rgba(61,255,160,0.35)';
    ctx.beginPath(); ctx.moveTo(pxp, pyp); ctx.lineTo(sinEndX, sinEndY); ctx.stroke(); // к оси y
    ctx.setLineDash([]);
  }

  // Точка (полупрозрачная — виден край блина под ней)
  ctx.beginPath(); ctx.arc(pxp, pyp, 8, 0, 2*Math.PI);
  ctx.fillStyle = 'rgba(255,68,102,0.55)'; ctx.fill();
  ctx.strokeStyle = '#ff8899'; ctx.lineWidth = 2; ctx.stroke();

  // ── Режим «Интервал»: путь A→B, точки A, B и бегущий огонёк ──
  if (intervalOn) {
    const b = intervalBounds();
    if (b) {
      const [aRad, bRad] = b;
      // высота точки на данном угле (дискретно по блинам или плавно по спирали)
      const zAt = g => (spiralMode ? g/(2*Math.PI) : Math.floor(g/(2*Math.PI))) * gap;

      // Золотая подсветка пути A→B. В спирали линию красит drawSpiralBody;
      // здесь рисуем путь по дугам блинов (для режима «блины»).
      if (!spiralMode) {
        const lo = Math.min(aRad, bRad), hi = Math.max(aRad, bRad);
        ctx.strokeStyle = '#ffc84d'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        const pathSteps = Math.max(4, Math.round((hi - lo) / (2*Math.PI) * 96));
        ctx.beginPath();
        let started = false;
        for (let i = 0; i <= pathSteps; i++) {
          const g = lo + (hi - lo) * i / pathSteps;
          const [sx, sy] = project(Math.cos(g), Math.sin(g), zAt(g), ox, oy, r);
          // при переходе на новый блин (скачок высоты) прерываем линию
          if (i > 0) {
            const gp = lo + (hi - lo) * (i-1) / pathSteps;
            if (Math.floor(g/(2*Math.PI)) !== Math.floor(gp/(2*Math.PI))) {
              ctx.stroke(); ctx.beginPath(); started = false;
            }
          }
          if (!started) { ctx.moveTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
        }
        ctx.stroke();
        ctx.lineCap = 'butt';
      }

      // метка точки A/B на своём блине
      const drawAB = (g, label, color) => {
        const [sx, sy] = project(Math.cos(g), Math.sin(g), zAt(g), ox, oy, r);
        ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 2*Math.PI);
        ctx.fillStyle = color; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.font = FONT_ITALIC;
        ctx.fillText(label, sx + 10, sy + 4);
      };
      drawAB(aRad, 'A', '#3dffa0');
      drawAB(bRad, 'B', '#4db8ff');

      // огонёк бежит от A до B по пути (glowT ∈ 0..1)
      const g = aRad + (bRad - aRad) * glowT;
      const [gx, gy] = project(Math.cos(g), Math.sin(g), zAt(g), ox, oy, r);
      // свечение (радиальный градиент) — ярче и золотистее
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 13);
      grad.addColorStop(0,   'rgba(255,250,210,1)');
      grad.addColorStop(0.35,'rgba(255,205,80,0.95)');
      grad.addColorStop(0.7, 'rgba(255,170,40,0.5)');
      grad.addColorStop(1,   'rgba(255,150,20,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(gx, gy, 13, 0, 2*Math.PI); ctx.fill();
      // ядро огонька
      ctx.beginPath(); ctx.arc(gx, gy, 3.5, 0, 2*Math.PI);
      ctx.fillStyle = '#fffbe0'; ctx.fill();
    }
  }

  update3DStats();
}

// Рисует стрелку на конце оси
function drawArrowHead(tx, ty, fx, fy) {
  const a = Math.atan2(ty - fy, tx - fx);
  ctx.fillStyle = CAKE.axis;
  ctx.beginPath();
  ctx.moveTo(tx, ty);
  ctx.lineTo(tx - 8*Math.cos(a - 0.4), ty - 8*Math.sin(a - 0.4));
  ctx.lineTo(tx - 8*Math.cos(a + 0.4), ty - 8*Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill();
}

// Плоские блины (нулевая толщина). Появляются по мере накрутки угла:
// показываем уровни между 0 и текущим оборотом включительно.
// Новый (текущий) блин плавно проявляется через camAnim (fade-in).
function drawPancakes(ox, oy, r, gap, lo, hi, cur) {
  // Диапазон блинов задаётся снаружи (lo..hi): обычно 0..текущий,
  // а в режиме «Интервал» — все блины между A и B.
  const from = lo;
  const to   = hi;
  // Прогресс проявления текущего блина: 0 в момент появления → 1 когда камера доехала.
  const fade = Math.max(0, Math.min(1, 1 - Math.abs(camAnim.current - cur)));

  ctx.save();
  for (let lv = to; lv >= from; lv--) {
    const z = lv * gap;
    // текущий блин появляется плавно; остальные — непрозрачные
    ctx.globalAlpha = (lv === cur && cur !== 0 && !intervalOn) ? fade : 1;
    pancakePath(ox, oy, r, z);
    if (lv === 0) {
      ctx.strokeStyle = CAKE.ring; ctx.lineWidth = 2; ctx.stroke();
    } else if (lv === cur) {
      ctx.fillStyle = CAKE.fillHi; ctx.fill();
      ctx.strokeStyle = CAKE.ring; ctx.lineWidth = 3; ctx.stroke();
    } else {
      ctx.fillStyle = CAKE.fill; ctx.fill();
      ctx.strokeStyle = CAKE.ring; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }
  ctx.restore();
}

// Спираль-«рельсы»: от 0 до конца ТЕКУЩЕГО витка. При движении назад витки
// «спереди» (по ходу прежнего движения) пропадают — рисуем только до точки.
function drawSpiralBody(ox, oy, r, gap, turns) {
  const TP = 2 * Math.PI;
  // Конец рельсов — граница текущего витка по направлению от 0.
  //  • вверх (angle≥0): до (lvl+1)·2π (верх текущего витка);
  //  • вниз (angle<0): до lvl·2π (низ текущего витка).
  let aStart = 0;
  let aEnd = (angle >= 0) ? (lvl + 1) * TP : lvl * TP;

  // В режиме «Интервал» рельсы охватывают весь диапазон A..B (и точку).
  if (intervalOn) {
    const b = intervalBounds();
    if (b) {
      aStart = Math.min(0, b[0], b[1], angle);
      aEnd   = Math.max(0, b[0], b[1], angle);
    }
  }
  const span = aEnd - aStart;
  if (Math.abs(span) < 1e-4) return;
  const segs  = Math.max(6, Math.round(Math.abs(span) / TP * 160));
  const angAt = i => aStart + span * i / segs;

  // Высота с анимацией рождения витка. Кольцо рождается на уровне отметки
  // текущего lvl (z = lvl·gap) и вытягивается в виток по мере t→1.
  const birthRingZ = birthAnim.lvl * gap;
  const zAt = a => {
    const zReal = (a / TP) * gap;
    if (birthAnim.t >= 1) return zReal;
    const inNewTurn = (birthAnim.lvl >= 0) ? (a >= birthAnim.lvl * TP)
                                           : (a <= (birthAnim.lvl + 1) * TP);
    return inNewTurn ? birthRingZ + (zReal - birthRingZ) * birthAnim.t : zReal;
  };

  // Пройденный путь точкой: [min(0,ψ), max(0,ψ)] — серый.
  const sweptLo = Math.min(0, angle), sweptHi = Math.max(0, angle);
  // Интервал A..B — золотой (если включён и не пройден).
  let goldLo = null, goldHi = null;
  if (intervalOn) {
    const b = intervalBounds();
    if (b) { goldLo = Math.min(b[0], b[1]); goldHi = Math.max(b[0], b[1]); }
  }
  const colorAt = a => {
    // Приоритет: золотой интервал A→B выше серого следа, чтобы весь выбранный
    // путь был виден целиком; затем серый (пройдено); затем коралловый (впереди).
    if (goldLo !== null && a >= goldLo - 1e-9 && a <= goldHi + 1e-9) return '#ffc84d'; // интервал
    if (a >= sweptLo - 1e-9 && a <= sweptHi + 1e-9) return 'rgba(190,196,222,0.95)'; // пройдено
    return CAKE.ring; // рельсы впереди
  };

  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  for (let i = 0; i < segs; i++) {
    const a1 = angAt(i), a2 = angAt(i+1);
    const [x1, y1] = project(Math.cos(a1), Math.sin(a1), zAt(a1), ox, oy, r);
    const [x2, y2] = project(Math.cos(a2), Math.sin(a2), zAt(a2), ox, oy, r);
    ctx.strokeStyle = colorAt((a1 + a2) / 2);
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

// Обновление панели значений в 3D (идентично 2D)
function update3DStats() {
  const sinA = Math.sin(angle), cosA = Math.cos(angle);
  const tanA = Math.tan(angle), cotA = cosA / sinA;
  const special = findSpecial(angle);
  DOM.deg.textContent = Math.round(angle * 180 / Math.PI);
  DOM.rad.textContent = radLabel(angle);
  DOM.lvl.textContent = I18N[lang]['lvl'] + ': ' + lvl;
  DOM.sin.textContent = fmt(sinA, 'sin', special);
  DOM.cos.textContent = fmt(cosA, 'cos', special);
  DOM.tan.textContent = fmt(tanA, 'tan', special);
  DOM.cot.textContent = fmt(cotA, 'cot', special);
  fitCellValues();
}

// ════════════════════════════════════════════════
//  ГЛАВНАЯ ФУНКЦИЯ РИСОВАНИЯ
// ════════════════════════════════════════════════

function draw() {
  if (is3D) { draw3D(); return; }
  ctx.clearRect(0, 0, W, H);

  // Тригонометрические значения текущего угла
  const sinA = Math.sin(angle);
  const cosA = Math.cos(angle);
  const tanA = Math.tan(angle);
  const cotA = cosA / sinA;

  // Координаты точки P = (cos ψ, sin ψ) на единичной окружности в системе canvas.
  // Canvas: ось Y направлена вниз, поэтому py = cy - R·sinA.
  px = cx + R * cosA;
  py = cy - R * sinA;

  const special = findSpecial(angle);
  const norm    = normalizeAngle(angle);

  // ── 1. Сетка (пунктирные вспомогательные линии) ──
  ctx.strokeStyle = '#1a1e2a';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(W, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, H); ctx.stroke();
  ctx.setLineDash([]);

  // ── 2. Оси координат X и Y ──
  ctx.strokeStyle = '#2a3040';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(8, cy); ctx.lineTo(W-8, cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, H-8); ctx.stroke();
  ctx.fillStyle = '#2a3040';
  drawArrow(W-8, cy, 'r');
  drawArrow(cx,  8,  'u');

  // ── 3. Единичная окружность ──
  ctx.strokeStyle = CAKE.ring;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2*Math.PI); ctx.stroke();

  // ── 4. Засечки в табличных углах ──
  // Используем предвычисленные TICK_DATA — cos/sin уже посчитаны при загрузке.
  ctx.strokeStyle = '#4a5570';
  ctx.lineWidth = 1.5;
  for (const [tx, ty] of TICK_DATA) {
    ctx.beginPath();
    ctx.moveTo(cx + (R-6)*tx, cy - (R-6)*ty);
    ctx.lineTo(cx + (R+6)*tx, cy - (R+6)*ty);
    ctx.stroke();
  }

  // ── 5. Серая дуга = длина дуги = угол в радианах ──
  // На единичной окружности r=1, поэтому длина дуги = угол в радианах.
  // Это наглядно показывает физический смысл радиана.
  ctx.strokeStyle = 'rgba(190,196,222,0.95)';
  ctx.lineWidth = 3.5;
  ctx.lineCap = 'round';
  drawArc(R, norm);
  ctx.lineCap = 'butt';

  // ── 6. Малая пунктирная дуга угла ψ (у центра) ──
  ctx.strokeStyle = 'rgba(124,109,250,0.5)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 4]);
  drawArc(R * 0.18, norm);
  ctx.setLineDash([]);

  // ── 7. Подписи табличных углов ──
  if (showLabels) drawAngleLabels();

  // ── 8. Ось котангенсов (горизонталь y = 1) ──
  // cot ψ = cos/sin — длина отрезка от точки (0,1) до пересечения радиуса с y=1.
  if (showCot && Math.abs(sinA) > 0.008) {
    const cotX    = cx + R * (cosA / sinA); // x-координата конца отрезка
    const cotAxisY = cy - R;                // canvas y для y=1 в математике

    ctx.strokeStyle = 'rgba(255,95,160,0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(10, cotAxisY); ctx.lineTo(W-10, cotAxisY); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,95,160,0.55)';
    ctx.beginPath(); ctx.moveTo(W-8,cotAxisY); ctx.lineTo(W-15,cotAxisY-3); ctx.lineTo(W-15,cotAxisY+3); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(255,95,160,0.9)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cotAxisY); ctx.lineTo(cotX, cotAxisY); ctx.stroke();

    dashedToHorizontal(cotAxisY, 'rgba(255,95,160,0.3)');

    ctx.fillStyle = 'rgba(255,95,160,0.9)';
    ctx.font = FONT_ITALIC;
    ctx.fillText('cot ψ', W-52, cotAxisY-6);
  }

  // ── 9. Ось тангенсов (вертикаль x = 1) ──
  // tan ψ = sin/cos — длина отрезка от точки (1,0) до пересечения радиуса с x=1.
  if (showTan && Math.abs(cosA) > 0.008) {
    const tanAxisX  = cx + R;
    const tanY      = cy - R * tanA;
    const tanYclamp = Math.max(4, Math.min(H-4, tanY));

    ctx.strokeStyle = 'rgba(255,170,0,0.4)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(tanAxisX, 10); ctx.lineTo(tanAxisX, H-10); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(255,170,0,0.55)';
    ctx.beginPath(); ctx.moveTo(tanAxisX,8); ctx.lineTo(tanAxisX-3,15); ctx.lineTo(tanAxisX+3,15); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(255,170,0,0.9)';
    ctx.lineWidth = 2.5;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
    ctx.beginPath(); ctx.moveTo(tanAxisX, cy); ctx.lineTo(tanAxisX, tanYclamp); ctx.stroke();
    ctx.restore();

    dashedToVertical(tanAxisX, 'rgba(255,170,0,0.3)');

    ctx.fillStyle = 'rgba(255,170,0,0.9)';
    ctx.font = FONT_ITALIC;
    ctx.fillText('tan ψ', tanAxisX+5, 22);
  }

  // ── 10. Радиус-вектор r = 1 ──
  ctx.strokeStyle = 'rgba(190,196,222,0.95)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();

  // Подпись r=1 вдоль линии радиуса (повёрнута параллельно)
  {
    const dx  = px - cx, dy = py - cy;
    const len = Math.sqrt(dx*dx + dy*dy);
    ctx.save();
    ctx.translate((cx+px)/2 + dy/len*10, (cy+py)/2 - dx/len*10);
    ctx.rotate(Math.atan2(dy, dx));
    ctx.fillStyle = 'rgba(200,207,224,0.55)';
    ctx.font = "500 10px 'JetBrains Mono', monospace";
    ctx.textAlign = 'center';
    ctx.fillText('r=1', 0, 0);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  // Предвычисляем ширину строки 'cos ψ' — используется в двух режимах
  const cosLblW = ctx.measureText('cos ψ').width;

  // ── 11. Режим «координаты»: прямоугольный треугольник ──
  // Наглядно показывает, что cos ψ и sin ψ — это катеты прямоугольного треугольника,
  // вписанного в единичную окружность.
  if (showCoords) {
    // Вертикальный катет = sin ψ (от оси X до точки P)
    ctx.strokeStyle = '#3dffa0';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();

    // Горизонтальный катет = cos ψ (от начала координат до проекции P на X)
    ctx.strokeStyle = '#4db8ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke();

    // Значок прямого угла в точке (px, cy)
    const s  = 9;
    const dx = cosA >= 0 ? -s : s;
    const dy = sinA >= 0 ? -s : s;
    ctx.strokeStyle = 'rgba(200,220,255,0.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px+dx, cy);
    ctx.lineTo(px+dx, cy+dy);
    ctx.lineTo(px,    cy+dy);
    ctx.stroke();

    // Подписи катетов
    ctx.font = FONT_ITALIC; // установлен один раз для обоих режимов
    ctx.fillStyle = '#3dffa0';
    ctx.fillText('sin ψ', cosA >= 0 ? px+6 : px-42, (cy+py)/2+4);
    ctx.fillStyle = '#4db8ff';
    const cosLbl = 'cos ψ';
    ctx.fillText(cosLbl, (cx+px)/2 - cosLblW/2, sinA >= 0 ? cy+15 : cy-5);
  }

  // ── 12. Режим «sin/cos»: проекции на оси ──
  if (showSin) {
    const sinEndY = cy - sinA * R;
    const cosEndX = cx + cosA * R;

    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#3dffa0';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, sinEndY); ctx.stroke();
    ctx.strokeStyle = '#4db8ff';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cosEndX, cy); ctx.stroke();
    ctx.lineCap = 'butt';

    // Пунктирные проекции от точки P до осей
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 5]);
    ctx.strokeStyle = 'rgba(61,255,160,0.25)';
    ctx.beginPath(); ctx.moveTo(cx, py); ctx.lineTo(px, py); ctx.stroke();
    ctx.strokeStyle = 'rgba(77,184,255,0.25)';
    ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();
    ctx.setLineDash([]);

    // Фиксированные подписи у концов осей
    ctx.font = FONT_ITALIC;
    ctx.fillStyle = '#3dffa0';
    ctx.fillText('sin ψ', cx+6, 22);
    ctx.fillStyle = '#4db8ff';
    const cosLbl = 'cos ψ';
    ctx.fillText(cosLbl, W - cosLblW - 8, cy-6);
  }

  // ── 13. Метка угла ψ у дуги ──
  // При оборотах добавляется суффикс ±n·2π.
  {
    const mid = angle / 2;
    const r   = R * 0.22;
    const lbl = lvl === 0 ? 'ψ' : lvl > 0 ? 'ψ+' + lvl + '·2π' : 'ψ' + lvl + '·2π';
    ctx.fillStyle = 'rgba(200,207,224,0.7)';
    ctx.font = "italic 14px 'Crimson Pro', serif";
    ctx.fillText(lbl, cx + r*Math.cos(mid) - 4, cy - r*Math.sin(mid) + 5);
  }

  // ── 14. Точка P на окружности (полупрозрачная, как в 3D) ──
  ctx.beginPath(); ctx.arc(px, py, 7, 0, 2*Math.PI);
  ctx.fillStyle = 'rgba(255,68,102,0.55)'; ctx.fill();
  ctx.strokeStyle = '#ff8899'; ctx.lineWidth = 2; ctx.stroke();

  // ── 15. Координатная метка (cos ψ, sin ψ) с цветовым выделением ──
  if (showCoords) {
    const cX = fmt(cosA, 'cos', special);
    const cY = fmt(sinA, 'sin', special);
    ctx.font = FONT_MONO;
    let lx = px+10, ly = py-10;
    if (px > W*0.75) lx = px-100;
    if (py < H*0.15) ly = py+20;
    const DIM = 'rgba(200,207,224,0.7)';
    const parts = [['(', DIM], [cX, '#4db8ff'], [', ', DIM], [cY, '#3dffa0'], [')', DIM]];
    for (const [text, color] of parts) {
      ctx.fillStyle = color;
      ctx.fillText(text, lx, ly);
      lx += ctx.measureText(text).width;
    }
  }

  // ── 16. Обновление панели значений ──
  // Обновляем DOM через кэшированные ссылки (не getElementById каждый кадр)
  DOM.deg.textContent = Math.round(angle * 180 / Math.PI);
  DOM.rad.textContent = radLabel(angle);
  DOM.lvl.textContent = I18N[lang]['lvl'] + ': ' + lvl;
  DOM.sin.textContent = fmt(sinA, 'sin', special);
  DOM.cos.textContent = fmt(cosA, 'cos', special);
  DOM.tan.textContent = fmt(tanA, 'tan', special);
  DOM.cot.textContent = fmt(cotA, 'cot', special);

  // Подгоняем размер шрифта каждой ячейки под её ширину —
  // гарантирует, что длинные значения (5.90−1·2π) всегда помещаются целиком.
  fitCellValues();
}

// Уменьшает font-size значения ячейки, если текст не помещается по ширине.
// Базовый размер 16px, минимальный 9px.
//
// Оптимизация: подбор запускается только для ячеек, чей текст изменился
// (кэш lastFitText), и читает геометрию одним проходом, не чередуя записи
// и чтения стилей — это убирает layout thrashing при перетаскивании.
const lastFitText = {};
function fitCellValues() {
  const keys = ['deg','rad','sin','cos','tan','cot'];

  // Фаза 1: определяем, какие ячейки реально изменились, и сбрасываем их шрифт.
  const toCheck = [];
  for (const key of keys) {
    const el = DOM[key];
    if (!el) continue;
    const txt = el.textContent;
    if (txt === lastFitText[key]) continue; // текст не менялся — пропускаем
    lastFitText[key] = txt;
    el.style.fontSize = '16px';             // сброс к базовому
    toCheck.push(el);
  }
  if (toCheck.length === 0) return;

  // Фаза 2: читаем геометрию всех изменённых ячеек разом (один reflow на все).
  const metrics = toCheck.map(el => [el, el.clientWidth, el.scrollWidth]);

  // Фаза 3: применяем подобранный размер.
  for (const [el, avail, needed] of metrics) {
    if (avail > 0 && needed > avail) {
      el.style.fontSize = Math.max(9, Math.floor(16 * avail / needed) - 1) + 'px';
    }
  }
}

// Рисует подписи табличных углов вокруг окружности.
// При ненулевом lvl добавляет суффикс ±n·2π к каждой метке.
// TICK_DATA содержит [cos, sin, label] — всё нужное без пересчёта.
function drawAngleLabels() {
  ctx.font = "10px 'JetBrains Mono', monospace";
  ctx.fillStyle = '#5a6a88';
  const suffix      = lvl === 0 ? '' : (lvl > 0 ? '+' : '') + lvl + '·2π';
  const cleanSuffix = suffix.replace('+', ''); // для метки '0'
  for (const [tx, ty, label] of TICK_DATA) {
    const lx      = cx + (R+18) * tx;
    const ly      = cy - (R+18) * ty;
    const display = label === '0' && lvl !== 0 ? cleanSuffix : label + suffix;
    ctx.fillText(display, lx - ctx.measureText(display).width/2, ly+4);
  }
}

// ════════════════════════════════════════════════
//  ОБРАБОТКА ВВОДА
// ════════════════════════════════════════════════

// Вычисляет математический угол из позиции курсора/касания.
// atan2(y, x) возвращает угол ∈ (-π, π].
// Canvas Y перевёрнут, поэтому берём (cy - clientY).
function getRawAngle(e) {
  const rect = canvas.getBoundingClientRect();
  const src  = e.touches ? e.touches[0] : e;
  const mx   = (src.clientX - rect.left) * (W / rect.width);
  const my   = (src.clientY - rect.top)  * (H / rect.height);

  if (is3D) {
    // «Схватил и кручу»: угол мыши вокруг центра блина в ЭКРАННЫХ координатах.
    // Не разворачиваем наклон (не делим на tilt) — поэтому нет
    // гиперчувствительности у «полюсов» сплюснутого эллипса.
    // Дельту этого угла updateAngle накапливает в angle (см. is3D-ветку там).
    return Math.atan2(-(my - ISO.centerY), mx - ISO.ox);
  }

  return Math.atan2(cy - my, mx - cx);
}

// Обновляет накопленный угол и счётчики оборотов при каждом движении.
function updateAngle(raw) {
  if (is3D) {
    // 3D: raw — экранный угол мыши. Накапливаем его дельту прямо в angle
    // (grab-and-rotate). Один оборот мыши = один оборот точки, плавно.
    if (prevRawAngle !== null) {
      let d = raw - prevRawAngle;
      // нормализуем дельту в (−π, π], чтобы не прыгало на границе ±π
      if (d >  Math.PI) d -= 2 * Math.PI;
      if (d < -Math.PI) d += 2 * Math.PI;
      const prevNorm = normalizeAngle(angle);
      angle += d;
      // обновляем lvl по пересечению 0°/360°
      const norm = normalizeAngle(angle);
      const dn = norm - prevNorm;
      if (dn < -Math.PI) lvl++;
      if (dn >  Math.PI) lvl--;
    }
    prevRawAngle = raw;

    const special = findSpecial(angle);
    if (special && special !== lastSpecial) {
      if (navigator.vibrate) navigator.vibrate(30);
      lastSpecial = special;
    } else if (!special) {
      lastSpecial = null;
    }
    if (typeof syncSlider === 'function') syncSlider();
    draw();
    return;
  }

  if (prevRawAngle !== null) {
    const delta = raw - prevRawAngle;
    // atan2 скачет на ~2π при пересечении границы ±π (каждые 180°).
    // Компенсируем прыжок в счётчике полуоборотов.
    if (delta < -Math.PI) revolutions++;
    if (delta >  Math.PI) revolutions--;
  }
  prevRawAngle = raw;
  angle = raw + revolutions * 2 * Math.PI;

  // Отслеживаем полные обороты через нормализованный угол.
  // Прыжок нормализованного угла с ~2π до ~0 → один CCW-оборот (lvl++).
  // Прыжок с ~0 до ~2π → один CW-оборот (lvl--).
  const norm = normalizeAngle(angle);
  if (prevNormAngle !== null) {
    const dn = norm - prevNormAngle;
    if (dn < -Math.PI) lvl++;
    if (dn >  Math.PI) lvl--;
  }
  prevNormAngle = norm;

  // Вибрация при попадании в табличный угол (работает на Android)
  const special = findSpecial(angle);
  if (special && special !== lastSpecial) {
    if (navigator.vibrate) navigator.vibrate(30);
    lastSpecial = special;
  } else if (!special) {
    lastSpecial = null;
  }

  if (typeof syncSlider === 'function') syncSlider();
  draw();
}

// При новом касании синхронизируем revolutions с текущим angle.
// Без этого при повторном касании будет прыжок угла.
function startDrag(e) {
  dragging      = true;
  const raw     = getRawAngle(e);
  if (is3D) {
    // В 3D просто запоминаем стартовый экранный угол — дальше копим дельту
    prevRawAngle = raw;
    return;
  }
  revolutions   = Math.round((angle - raw) / (2 * Math.PI));
  prevNormAngle = normalizeAngle(angle);
  updateAngle(raw);
}

function endDrag() { dragging = false; prevRawAngle = null; }

canvas.addEventListener('mousedown',  e => startDrag(e));
canvas.addEventListener('mousemove',  e => { if (dragging) updateAngle(getRawAngle(e)); });
canvas.addEventListener('mouseup',    () => endDrag());
canvas.addEventListener('touchend',   () => { endDrag(); twoFinger = false; });

// ── Ручное перемещение камеры вверх/вниз по блинам (только 3D) ──
// Колесо мыши сдвигает обзор; ISO.camY — ручной вертикальный сдвиг.
canvas.addEventListener('wheel', e => {
  if (!is3D) return;
  e.preventDefault();
  ISO.camY -= e.deltaY * 0.5;
  draw();
}, {passive:false});

// Тач: один палец — вращение точки, два пальца — перемещение камеры по вертикали.
let twoFinger = false, twoFingerY = 0;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (is3D && e.touches.length === 2) {
    twoFinger = true;
    twoFingerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    dragging = false;
    return;
  }
  startDrag(e);
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (twoFinger && e.touches.length === 2) {
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    ISO.camY += (midY - twoFingerY);
    twoFingerY = midY;
    draw();
    return;
  }
  if (dragging) updateAngle(getRawAngle(e));
}, {passive:false});

// Сброс: угол нормализуется в [0, 2π), счётчики обнуляются. Точка не прыгает.
document.getElementById('btn-reset').addEventListener('click', () => {
  lvl = revolutions = 0;
  angle         = normalizeAngle(angle);
  prevRawAngle  = null;
  prevNormAngle = normalizeAngle(angle);
  ISO.camY = 0; // сброс ручного сдвига камеры
  camAnim.current = camAnim.target = 0;
  birthAnim.lvl = 0; birthAnim.t = 1;
  birthAnim.reachedHi = birthAnim.reachedLo = 0;
  prevSpiralLvl = 0;
  if (typeof camYTarget !== 'undefined') camYTarget = 0;
  draw();
});

// Переключатели видимости. sin/cos и координаты взаимоисключают друг друга.
// По умолчанию всё выключено.
const state = {sin: false, tan: false, cot: false, labels: false, coords: false};

// Показывает/прячет ячейки значений в зависимости от состояния кнопок.
// sin/cos видны при кнопке «sin и cos» ИЛИ «координаты» (там они — катеты).
// tan и cot — каждая по своей кнопке.
function updateValueCells() {
  const sinCos = (state.sin || state.coords) ? '' : 'none';
  document.getElementById('cell-sin').style.display = sinCos;
  document.getElementById('cell-cos').style.display = sinCos;
  document.getElementById('cell-tan').style.display = state.tan ? '' : 'none';
  document.getElementById('cell-cot').style.display = state.cot ? '' : 'none';
  // Видимость изменилась — сбрасываем кэш, чтобы шрифт пересчитался при показе
  for (const k in lastFitText) delete lastFitText[k];
}

['sin','tan','cot','labels','coords'].forEach(k => {
  document.getElementById('btn-'+k).addEventListener('click', function() {
    state[k] = !state[k];

    if (k === 'sin'    && state.sin    && state.coords) { state.coords = false; document.getElementById('btn-coords').classList.remove('active'); }
    if (k === 'coords' && state.coords && state.sin)    { state.sin    = false; document.getElementById('btn-sin').classList.remove('active'); }

    showSin = state.sin; showTan = state.tan; showCot = state.cot;
    showLabels = state.labels; showCoords = state.coords;

    this.classList.toggle('active');
    updateValueCells();
    draw();
  });
});

// Изначально прячем ячейки sin/cos/tan/cot (кнопки выключены)
updateValueCells();

// Кнопка 2D/3D — переключение плоского вида и «блинного торта»

// Стрелки вертикального перемещения камеры (плавное смещение)
let camYTarget = 0, camYRaf = 0;
function animateCamY() {
  if (camYRaf) return;
  const step = () => {
    const d = camYTarget - ISO.camY;
    if (Math.abs(d) < 0.5) { ISO.camY = camYTarget; camYRaf = 0; draw(); return; }
    ISO.camY += d * 0.15;
    draw();
    camYRaf = requestAnimationFrame(step);
  };
  camYRaf = requestAnimationFrame(step);
}
document.getElementById('cam-up').addEventListener('click', () => {
  camYTarget += ISO.levelGap * 0.6; animateCamY();   // вверх к верхним блинам
});
document.getElementById('cam-down').addEventListener('click', () => {
  camYTarget -= ISO.levelGap * 0.6; animateCamY();   // вниз к нижним блинам
});

// Кнопка «блины / спираль» — вид внутри 3D
document.getElementById('btn-mode3d').addEventListener('click', function() {
  spiralMode = !spiralMode;
  this.classList.toggle('active');
  // При входе в спираль текущий виток рождается из кольца.
  if (spiralMode) {
    birthAnim.reachedHi = Math.max(0, lvl);
    birthAnim.reachedLo = Math.min(0, lvl);
    prevSpiralLvl = lvl;
    startBirthTurn(lvl);
  }
  draw();
});

// ── Слайдер угла ψ ──
const angleSlider = document.getElementById('angle-slider');
angleSlider.addEventListener('input', function() {
  // Слайдер в градусах → радианы. Пересчитываем обороты/уровень.
  angle = parseFloat(this.value) * Math.PI / 180;
  revolutions = Math.round((angle - Math.atan2(Math.sin(angle), Math.cos(angle))) / (2*Math.PI));
  // lvl = число пройденных границ 0°/360° = floor (та же конвенция, что при drag).
  lvl = Math.floor(angle / (2*Math.PI));
  prevRawAngle = null;
  prevNormAngle = normalizeAngle(angle);
  draw();
});

// Синхронизирует положение слайдера с текущим углом (после перетаскивания/стрелок)
function syncSlider() {
  const deg = angle * 180 / Math.PI;
  const lo = parseFloat(angleSlider.min), hi = parseFloat(angleSlider.max);
  angleSlider.value = Math.max(lo, Math.min(hi, deg));
}

// ── Режим «Интервал» ──
let intervalUnit = 'deg'; // 'deg' | 'rad'
const intFrom = document.getElementById('interval-from');
const intTo   = document.getElementById('interval-to');

function applyInterval() {
  let from = parseFloat(intFrom.value);
  let to   = parseFloat(intTo.value);
  if (isNaN(from) || isNaN(to) || from >= to) return;
  // Приводим границы к градусам для слайдера
  if (intervalUnit === 'rad') {
    from = from * 180 / Math.PI;
    to   = to   * 180 / Math.PI;
  }
  angleSlider.min = Math.round(from);
  angleSlider.max = Math.round(to);
  syncSlider();
}
intFrom.addEventListener('change', applyInterval);
intTo.addEventListener('change', applyInterval);

document.getElementById('interval-unit').addEventListener('click', function() {
  intervalUnit = intervalUnit === 'deg' ? 'rad' : 'deg';
  this.textContent = intervalUnit === 'deg' ? '°' : 'рад';
  // Пересчитываем показанные границы в новую единицу
  if (intervalUnit === 'rad') {
    intFrom.value = (parseFloat(intFrom.value) * Math.PI / 180).toFixed(2);
    intTo.value   = (parseFloat(intTo.value)   * Math.PI / 180).toFixed(2);
  } else {
    intFrom.value = Math.round(parseFloat(intFrom.value) * 180 / Math.PI);
    intTo.value   = Math.round(parseFloat(intTo.value)   * 180 / Math.PI);
  }
  if (intervalOn) draw();
});

// ── Переключатель «Интервал»: точки A/B + бегущий огонёк ──
let intervalOn = false;   // показывать A, B и огонёк
let glowT = 0;            // прогресс огонька 0..1 (A→B)
let glowRaf = 0;

// Границы интервала в радианах (из полей «от/до»)
function intervalBounds() {
  let from = parseFloat(intFrom.value);
  let to   = parseFloat(intTo.value);
  if (isNaN(from) || isNaN(to)) return null;
  if (intervalUnit === 'deg') { from = from*Math.PI/180; to = to*Math.PI/180; }
  return [from, to];
}

function animateGlow() {
  if (glowRaf) return;
  const step = () => {
    if (!intervalOn || !is3D) { glowRaf = 0; return; }
    glowT += 0.002;                 // скорость огонька (медленно)
    if (glowT > 1) glowT = 0;       // циклично: добежал до B → снова от A
    draw();
    glowRaf = requestAnimationFrame(step);
  };
  glowRaf = requestAnimationFrame(step);
}

document.getElementById('interval-title').addEventListener('click', function() {
  intervalOn = !intervalOn;
  this.classList.toggle('active');
  if (intervalOn) { glowT = 0; animateGlow(); }
  draw();
});

// ════════════════════════════════════════════════
//  ИНИЦИАЛИЗАЦИЯ
// ════════════════════════════════════════════════

function resize() {
  const isDesktop = window.innerWidth >= 768;
  let maxSize;
  if (isDesktop) {
    // Правая панель до 360px + gap 24px + отступы ~48px
    maxSize = Math.min(window.innerWidth - 360 - 24 - 48, window.innerHeight - 48);
  } else {
    maxSize = window.innerWidth - 32;
  }
  W = H = Math.round(Math.max(maxSize, 280));

  // ── Retina-рендеринг ──
  // Физических пикселей на CSS-пиксель (2 на большинстве телефонов, 3 на flagship).
  // Без этого канвас рисуется в низком разрешении и текст/линии выглядят мутными.
  const dpr = window.devicePixelRatio || 1;

  // CSS-размер (логический, для верстки)
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  // Физический размер буфера (в реальных пикселях)
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  // Масштабируем контекст: дальше рисуем в логических координатах, а движок
  // отрисовывает в физическом разрешении → чёткие линии и шрифты.
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cx = cy = W / 2;
  R  = W * 0.36;

  // Вертикальный шаг одного оборота в 3D — доля высоты канваса
  ISO.levelGap = H * 0.30;

  // Ширина ячеек изменилась — сбрасываем кэш подбора шрифта,
  // чтобы fitCellValues пересчитал размеры под новую ширину.
  for (const k in lastFitText) delete lastFitText[k];

  draw();
}

// Инициализация текста (заголовок, пояснение, метки) и скрытие 3D-элементов
applyLang();
document.getElementById('interval-row').style.display = 'none';

resize();
window.addEventListener('resize', resize);
</script>
